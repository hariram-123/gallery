<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<h1>PHOTO GALLERY</h1>

<div class="gallery">

    <div class="card">
        <img src="mountain.jpg" alt="Image 1">
        <h3>Mountain View</h3>
    </div>

    <div class="card">
        <img src="forest.jpg" alt="Image 2">
        <h3>Forest</h3>
    </div>

    <div class="card">
        <img src="river.jpg" alt="Image 3">
        <h3>River</h3>
    </div>

    <div class="card">
        <img src="beach.jpg" alt="Image 4">
        <h3>Beach</h3>
    </div>

    <div class="card">
        <img src="dog.jpg" alt="Image 5">
        <h3>Dog</h3>
    </div>

    <div class="card">
        <img src="nature.jpg" alt="Image 6">
        <h3>Nature</h3>
    </div>

</div>

</body>
</html>
